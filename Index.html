<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Guess: 3D Number Guessing Game</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ---------- 1. COLOURS & BASICS ---------- */
:root {
  --bg: #05060f;
  --blue: #27d8ff;
  --purple: #a45cff;
  --text: #e8ecff;
  --muted: #8b92c9;
  --good: #4dffb0;
  --bad: #ff5c7a;
  --glow: var(--blue);      /* digit glow colour (changes on win / lose) */
  --depth: #5b34c4;         /* colour of the 3D "thickness" under the digits */
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100vh; color: var(--text);
  font-family: Orbitron, "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(60vw 50vh at 15% 0%, rgba(39,216,255,.20), transparent 70%),
    radial-gradient(60vw 50vh at 85% 10%, rgba(164,92,255,.25), transparent 70%),
    var(--bg);
  overflow-x: hidden;
}

/* Moving 3D grid floor behind everything */
.floor { position: fixed; left: 0; right: 0; bottom: 0; height: 55vh; perspective: 380px; pointer-events: none; z-index: 0; }
.floor::before {
  content: ""; position: absolute; inset: -50% -50% 0 -50%;
  transform: rotateX(68deg); transform-origin: bottom;
  background-image:
    linear-gradient(rgba(164,92,255,.55) 1px, transparent 1px),
    linear-gradient(90deg, rgba(39,216,255,.45) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: slide 2.5s linear infinite;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 80%);
          mask-image: linear-gradient(to top, #000 10%, transparent 80%);
}
@keyframes slide { to { background-position: 0 60px, 60px 0; } }

/* ---------- 2. LAYOUT ---------- */
main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 28px 18px 40px; text-align: center; }
h1 {
  margin: 0 0 6px; font-size: clamp(26px, 8vw, 40px); font-weight: 900; letter-spacing: .06em;
  background: linear-gradient(90deg, var(--blue), var(--purple));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 14px rgba(120,100,255,.55));
}
.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }

/* ---------- 3. THE 3D DIGITS ---------- */
.scene { perspective: 800px; padding: 14px 0 22px; }               /* gives depth to children */
.float { animation: bob 4s ease-in-out infinite; }                   /* gentle floating */
@keyframes bob { 50% { transform: translateY(-8px); } }
.digits {
  display: flex; justify-content: center; gap: clamp(8px, 3vw, 18px);
  transform-style: preserve-3d; transition: transform .15s ease-out;  /* JS tilts this */
}
.digit {
  width: clamp(70px, 23vw, 120px); height: clamp(100px, 32vw, 170px);
  display: grid; place-items: center;
  font-size: clamp(60px, 20vw, 112px); font-weight: 900; line-height: 1;
  border-radius: 20px;
  background: linear-gradient(160deg, rgba(39,216,255,.16), rgba(164,92,255,.20));
  border: 1px solid rgba(140,170,255,.35);
  box-shadow: 0 0 30px color-mix(in srgb, var(--glow) 35%, transparent), inset 0 0 24px rgba(255,255,255,.05);
  /* stacked text-shadows fake the thickness of 3D letters */
  text-shadow:
    0 1px 0 var(--depth), 0 2px 0 var(--depth), 0 3px 0 var(--depth),
    0 4px 0 var(--depth), 0 5px 0 var(--depth), 0 6px 0 var(--depth),
    0 0 22px var(--glow), 0 0 50px var(--glow);
  transition: box-shadow .4s, text-shadow .4s;
}
.digit.dim { opacity: .35; }                       /* leading zeros are faded */
.digit.spin { animation: spin .7s cubic-bezier(.2,.8,.3,1); }  /* flips each time a guess is made */
@keyframes spin { from { transform: rotateX(0) translateZ(0); } 50% { transform: rotateX(180deg) translateZ(40px); } to { transform: rotateX(360deg); } }
.scene.win  { --glow: var(--good); --depth: #17855a; }
.scene.lose { --glow: var(--bad);  --depth: #8a2037; }

/* ---------- 4. HINT, RANGE, ATTEMPTS ---------- */
.hint { min-height: 34px; font-size: clamp(16px, 4.6vw, 22px); font-weight: 700; letter-spacing: .04em; margin: 0 0 4px; }
.hint.up   { color: var(--blue);   text-shadow: 0 0 14px var(--blue); }
.hint.down { color: var(--purple); text-shadow: 0 0 14px var(--purple); }
.hint.good { color: var(--good);   text-shadow: 0 0 14px var(--good); }
.hint.bad  { color: var(--bad);    text-shadow: 0 0 14px var(--bad); }
.range { color: var(--muted); font-size: 13px; margin: 0 0 18px; min-height: 20px; }

.attempts { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
.attempts p { margin: 0; font-size: 14px; color: var(--muted); }
.attempts b { color: var(--text); }
.pips { display: flex; gap: 10px; }
.pip { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--purple); transition: all .35s; }
.pip.used { background: var(--bad);  border-color: var(--bad);  box-shadow: 0 0 12px var(--bad); }
.pip.win  { background: var(--good); border-color: var(--good); box-shadow: 0 0 12px var(--good); }

/* ---------- 5. INPUT & BUTTONS ---------- */
form { display: flex; gap: 10px; justify-content: center; }
input {
  width: min(52vw, 220px); padding: 14px 12px; font: 700 22px Orbitron, sans-serif; text-align: center;
  color: var(--text); background: rgba(15,18,46,.8);
  border: 2px solid rgba(39,216,255,.5); border-radius: 14px; outline: none;
  box-shadow: 0 0 18px rgba(39,216,255,.2);
}
input:focus-visible { border-color: var(--purple); box-shadow: 0 0 26px rgba(164,92,255,.55); }
input:disabled { opacity: .4; }
input.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
button {
  font: 700 15px Orbitron, sans-serif; letter-spacing: .06em; color: #fff; cursor: pointer;
  padding: 0 22px; border: 0; border-radius: 14px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  box-shadow: 0 0 22px rgba(120,100,255,.55); transition: transform .15s, box-shadow .15s;
}
button:hover:not(:disabled) { transform: translateY(-2px) scale(1.04); box-shadow: 0 0 34px rgba(120,100,255,.85); }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
button:disabled { opacity: .4; cursor: not-allowed; }
.restart { margin-top: 22px; padding: 13px 26px; background: transparent; border: 2px solid var(--purple); box-shadow: 0 0 16px rgba(164,92,255,.4); }
.restart.big { background: linear-gradient(135deg, var(--blue), var(--purple)); border-color: transparent; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 40px rgba(39,216,255,.9); } }

/* ---------- 6. HISTORY & CONFETTI ---------- */
.history { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; min-height: 30px; }
.chip { padding: 5px 12px; font-size: 13px; border-radius: 999px; border: 1px solid rgba(140,170,255,.4); background: rgba(20,24,60,.7); }
.chip.up   { color: var(--blue); }
.chip.down { color: var(--purple); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

@media (prefers-reduced-motion: reduce) {
  .floor::before, .float, .digit.spin, .restart.big { animation: none; }
}
</style>
</head>
<body>
<div class="floor"></div>
<canvas id="confetti"></canvas>

<main>
  <h1>NEON GUESS</h1>
  <p class="sub">Find the secret number from 1 to 100.<br>You have 7 attempts.</p>

  <!-- The 3D digit display. JS tilts .digits when you move your pointer over .scene -->
  <div class="scene" id="scene">
    <div class="float">
      <div class="digits" id="digits">
        <div class="digit">?</div><div class="digit">?</div><div class="digit">?</div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint" aria-live="polite">Enter your first guess</p>
  <p class="range" id="range"></p>

  <div class="attempts">
    <p>Attempts <b id="count">0</b> / 7</p>
    <div class="pips" id="pips"></div>
  </div>

  <form id="form" autocomplete="off">
    <input id="guess" type="number" inputmode="numeric" min="1" max="100" placeholder="1-100" aria-label="Your guess">
    <button id="go" type="submit">GUESS</button>
  </form>

  <div class="history" id="history" aria-label="Previous guesses"></div>
  <button class="restart" id="restart" type="button">RESTART</button>
</main>

<script>
/* ---------- GAME SETTINGS & STATE ---------- */
const MAX_TRIES = 7;
let secret, tries, low, high, finished;   // low/high = the range still possible

// Short helper so we can write $("id") instead of document.getElementById("id")
const $ = id => document.getElementById(id);
const digitEls = [...document.querySelectorAll(".digit")];

/* ---------- START / RESTART ---------- */
function newGame() {
  // Same idea as Python's random.randint(1, 100)
  secret = Math.floor(Math.random() * 100) + 1;
  tries = 0; low = 1; high = 100; finished = false;

  showNumber("???");
  $("scene").className = "scene";
  setHint("Enter your first guess", "");
  $("range").textContent = "";
  $("history").innerHTML = "";
  $("count").textContent = "0";
  $("pips").innerHTML = "<span class='pip'></span>".repeat(MAX_TRIES);
  $("guess").value = ""; $("guess").disabled = false; $("go").disabled = false;
  $("restart").classList.remove("big");
  $("restart").textContent = "RESTART";
  $("guess").focus();
}

/* ---------- SHOWING THINGS ON SCREEN ---------- */
// Puts a 3-character string on the 3D tiles and plays the flip animation
function showNumber(text, spin = false) {
  const chars = text.padStart(3, text === "???" ? "?" : "0");
  let leading = true;                        // fade leading zeros (007 -> 7 bright)
  digitEls.forEach((el, i) => {
    el.textContent = chars[i];
    if (chars[i] !== "0") leading = false;
    el.classList.toggle("dim", leading && chars[i] === "0" && i < 2);
    el.classList.remove("spin");
    if (spin) { void el.offsetWidth; el.style.animationDelay = i * 90 + "ms"; el.classList.add("spin"); }
  });
}

function setHint(message, kind) {
  const h = $("hint");
  h.textContent = message;
  h.className = "hint " + kind;
}

function addChip(value, direction) {
  const chip = document.createElement("span");
  chip.className = "chip " + direction;
  chip.textContent = value + (direction === "up" ? " \u2191" : " \u2193");
  $("history").appendChild(chip);
}

// Ends the round (win or lose): locks input and highlights Restart
function endGame(won) {
  finished = true;
  $("guess").disabled = true; $("go").disabled = true;
  $("restart").textContent = "PLAY AGAIN";
  $("restart").classList.add("big");
  $("scene").classList.add(won ? "win" : "lose");
}

/* ---------- THE MAIN GAME LOGIC (from your Python code) ---------- */
$("form").addEventListener("submit", event => {
  event.preventDefault();                    // stop the page from reloading
  if (finished) return;

  const raw = $("guess").value.trim();
  const guess = Number(raw);

  // Check the input is a whole number between 1 and 100 (invalid guesses don't count)
  if (raw === "" || !Number.isInteger(guess) || guess < 1 || guess > 100) {
    setHint("Enter a whole number from 1 to 100", "bad");
    $("guess").classList.remove("shake"); void $("guess").offsetWidth; $("guess").classList.add("shake");
    return;
  }

  tries++;                                   // like tries += 1 in Python
  $("count").textContent = tries;
  showNumber(String(guess), true);
  $("guess").value = ""; $("guess").focus();
  const pips = $("pips").children;

  if (guess === secret) {                    // WIN
    pips[tries - 1].classList.add("win");
    setHint(`You won in ${tries} ${tries === 1 ? "try" : "tries"}!`, "good");
    $("range").textContent = "";
    endGame(true);
    launchConfetti();
    return;
  }

  pips[tries - 1].classList.add("used");     // wrong guess: light up a pip

  if (guess > secret) {                      // too high -> go lower
    high = Math.min(high, guess - 1);
    setHint("Too high. Go lower \u2193", "down");
    addChip(guess, "down");
  } else {                                   // too low -> go higher
    low = Math.max(low, guess + 1);
    setHint("Too low. Go higher \u2191", "up");
    addChip(guess, "up");
  }
  $("range").textContent = `The number is between ${low} and ${high}`;

  if (tries >= MAX_TRIES) {                  // GAME OVER
    setHint("Game over!", "bad");
    $("range").textContent = `The secret number was ${secret}`;
    endGame(false);
    setTimeout(() => showNumber(String(secret), true), 900);   // reveal the answer
  }
});

$("restart").addEventListener("click", newGame);

/* ---------- 3D TILT: digits follow your pointer ---------- */
const scene = $("scene"), digits = $("digits");
scene.addEventListener("pointermove", e => {
  const r = scene.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;    // -0.5 .. 0.5
  const y = (e.clientY - r.top) / r.height - 0.5;
  digits.style.transform = `rotateX(${-y * 22}deg) rotateY(${x * 30}deg)`;
});
scene.addEventListener("pointerleave", () => { digits.style.transform = ""; });

/* ---------- CONFETTI (simple canvas particles) ---------- */
const canvas = $("confetti"), ctx = canvas.getContext("2d");
let pieces = [], running = false;
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener("resize", resize); resize();

function launchConfetti() {
  const colors = ["#27d8ff", "#a45cff", "#4dffb0", "#ff4fd8", "#ffffff"];
  for (let i = 0; i < 160; i++) {
    pieces.push({
      x: canvas.width / 2, y: canvas.height * 0.35,
      vx: (Math.random() - 0.5) * 16, vy: Math.random() * -14 - 3,   // burst upwards
      size: Math.random() * 8 + 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      color: colors[i % colors.length]
    });
  }
  if (!running) { running = true; requestAnimationFrame(animateConfetti); }
}
function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pieces.forEach(p => {
    p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.rot += p.vr;   // gravity + movement
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    ctx.restore();
  });
  pieces = pieces.filter(p => p.y < canvas.height + 30);     // drop pieces that fell off
  if (pieces.length) requestAnimationFrame(animateConfetti);
  else { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
}

newGame();   // begin the first round
</script>
</body>
</html>
